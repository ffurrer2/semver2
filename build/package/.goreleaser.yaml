# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

project_name: semver

release:
  draft: false
  prerelease: auto
  name_template: '{{.Tag}}'
  footer: |-

    ### GitHub Container registry images

    - `docker pull ghcr.io/ffurrer2/semver:{{.Major}}.{{.Minor}}.{{.Patch}}`
    - `docker pull ghcr.io/ffurrer2/semver:{{.Major}}.{{.Minor}}`
    - `docker pull ghcr.io/ffurrer2/semver:{{.Major}}`
    - `docker pull ghcr.io/ffurrer2/semver:latest`

    ### Docker Hub images

    - `docker pull docker.io/ffurrer/semver:{{.Major}}.{{.Minor}}.{{.Patch}}`
    - `docker pull docker.io/ffurrer/semver:{{.Major}}.{{.Minor}}`
    - `docker pull docker.io/ffurrer/semver:{{.Major}}`
    - `docker pull docker.io/ffurrer/semver:latest`

builds:
- id: semver
  goos:
  - darwin
  - linux
  - windows
  goarch:
  - '386'
  - amd64
  - arm64
  goarm:
  - '7'
  goamd64:
  - v1
  ignore:
  - goos: darwin
    goarch: '386'
  - goos: windows
    goarch: arm64
  dir: .
  main: ./cmd/semver
  binary: semver
  builder: go
  tool: go
  command: build
  ldflags:
  - -X github.com/ffurrer2/semver/v2/internal/pkg/app.version={{.Version}}
  - -extldflags "-static"
  - -s
  - -w
  flags:
  - -v
  - -mod=readonly
  - -trimpath
  env:
  - CGO_ENABLED=0

archives:
- id: semver
  ids:
  - semver
  name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}{{ if not (eq .Amd64 "v1") }}{{ .Amd64 }}{{ end }}'
  formats:
  - tar.gz
  format_overrides:
  - goos: windows
    formats:
    - zip
  files:
  - src: CHANGELOG.md
  - src: LICENSE
  - src: README.md

snapshot:
  version_template: '{{.Env.SNAPSHOT_VERSION}}'

checksum:
  name_template: '{{.ProjectName}}_checksums.txt'
  algorithm: sha256

changelog:
  format: '{{ .SHA }} {{ .Message }}'

dist: artifacts/dist

signs:
- cmd: cosign
  args:
  - sign-blob
  - --bundle=${signature}
  - ${artifact}
  - --yes
  signature: ${artifact}.sigstore.json
  artifacts: checksum

env_files:
  github_token: ~/.config/goreleaser/github_token

before:
  hooks:
  - go mod verify
  - go mod tidy -v
